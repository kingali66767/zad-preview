<section class="wrap ask" id="ask" aria-labelledby="ask-heading">
<div class="ask-panel">
<p class="eyebrow"><span></span> {{t:ask_eyebrow}}</p>
<h1 id="ask-heading" class="section-heading"><span class="section-icon" aria-hidden="true"><span class="zad-icon" data-icon="ask"></span></span>{{t:ask}}</h1>
<p>{{t:ask_intro}}</p>
<p id="ask-search-privacy" class="time-source">{{t:ask_privacy}}</p>
<p id="ask-agent-notice" class="time-source" hidden>{{t:ask_provider}}</p>
<form id="ask-form" class="ask-form" data-agent-endpoint="{{ASK_AGENT_ENDPOINT}}">
<label for="ask-input">{{t:your_question}}<input id="ask-input" type="text" dir="auto" maxlength="500" required aria-describedby="ask-search-privacy" placeholder="{{t:ask_example}}"></label>
<button class="button green" id="ask-submit" type="submit" disabled>{{t:ask_submit}}</button>
<button class="button ask-reset" id="ask-reset" type="button" hidden>{{t:ask_reset}}</button>
</form>
<p id="ask-status" role="status"></p>
<article class="card ask-result" id="ask-result" aria-labelledby="ask-answer-heading" hidden>
<p id="ask-question" dir="auto"></p>
<h3 id="ask-answer-heading" tabindex="-1"></h3>
<div id="ask-answer" dir="auto"></div>
<div class="references" id="ask-sources"></div>
<div class="ask-related" id="ask-related" hidden>
<h4>{{t:ask_related}}</h4>
<div id="ask-related-questions"></div>
</div>
</article>
<details class="fatwa-library" id="fatwa-library">
<summary><span class="zad-icon" data-icon="fatwa-library" aria-hidden="true"></span> {{t:ask_fatwas}}</summary>
<div class="fatwa-filters">
<label for="fatwa-scholar">{{t:scholar}}<select id="fatwa-scholar"></select></label>
<label for="fatwa-category">{{t:topic}}<select id="fatwa-category"></select></label>
</div>
<p id="fatwa-count" role="status"></p>
<ul id="fatwa-list"></ul>
</details>
<details class="ask-optional">
<summary><span class="zad-icon" data-icon="ai" aria-hidden="true"></span> {{t:ask_ai}}</summary>
<p>{{t:ask_ai_intro}}</p>
<button class="button green" id="ask-enable" type="button">{{t:ask_ai_start}}</button>
<p id="ask-model-status" role="status"></p>
</details>
<noscript><p>{{t:ask_nojs}} <a href="../discover/">{{t:ask_guide_nojs}}</a></p></noscript>
</div>
</section>
