<section class="wrap site-tour" id="site-tour" aria-labelledby="site-tour-heading" tabindex="-1">
<div class="site-tour-heading">
<h2 id="site-tour-heading">{{t:tour_heading}}</h2>
<p>{{t:tour_intro}}</p>
</div>
<div class="site-tour-stops">
<a class="site-tour-card" href="quran/" aria-labelledby="tour-read-action">
<span class="section-icon" aria-hidden="true"><span class="zad-icon" data-icon="quran"></span></span>
<div>
<h3>{{t:tour_read_title}}</h3>
<p>{{t:tour_read_intro}}</p>
<span class="site-tour-action" id="tour-read-action">{{t:tour_read_action}}</span>
</div>
</a>
<a class="site-tour-card" href="worship/" aria-labelledby="tour-worship-action">
<span class="section-icon" aria-hidden="true"><span class="zad-icon" data-icon="worship"></span></span>
<div>
<h3>{{t:tour_practice_title}}</h3>
<p>{{t:tour_practice_intro}}</p>
<span class="site-tour-action" id="tour-worship-action">{{t:tour_practice_action}}</span>
</div>
</a>
<section class="site-tour-card">
<span class="section-icon" aria-hidden="true"><span class="zad-icon" data-icon="ask"></span></span>
<div>
<h3>{{t:tour_ask_title}}</h3>
<p>{{t:tour_ask_intro}}</p>
<div class="site-tour-actions">
<a class="site-tour-action" href="ask/">{{t:ask}}</a>
<a class="site-tour-action" href="discover/">{{t:discover}}</a>
</div>
</div>
</section>
</div>
</section>
