<h1 id="sources-heading" class="section-heading"><span class="section-icon" aria-hidden="true"><span class="zad-icon" data-icon="sources"></span></span>مصادر المكتبة</h1>
<p>تستند المواد إلى القرآن والسنة الصحيحة، وإلى تفاسير وفتاوى من أهل السنة والجماعة. تُرفق بكل مادة إحالة إلى دليلها أو مصدرها، وتُنسب ملخّصات الفتاوى إلى الجهة أو العالم المذكور.</p>
