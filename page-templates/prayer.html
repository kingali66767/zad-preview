<section class="wrap prayer" id="prayer" aria-labelledby="prayer-heading" data-prayer-widget>
<div class="prayer-head">
<div>
<p class="eyebrow"><span></span> {{t:saudi}}</p>
<h1 id="prayer-heading" class="section-heading"><span class="section-icon" aria-hidden="true"><span class="zad-icon" data-icon="prayer"></span></span>{{t:prayer}}</h1>
</div>
<form id="prayer-form">
<label for="city">{{t:city}}
<select id="city" data-prayer-city>
{{prayer_cities}}
</select>
</label>
<button class="button green" type="submit">{{t:show_times}}</button>
</form>
</div>
<div class="times" id="times" data-prayer-times></div>
<p id="prayer-status" data-prayer-status role="status">{{t:prayer_choose}}</p>
<p class="time-source">{{t:reference}} <a href="https://aladhan.com/prayer-times-api">AlAdhan</a> · {{t:prayer_method}}</p>
<details class="prayer-note">
<summary>{{t:prayer_how}}</summary>
<p>{{t:prayer_details}}</p>
</details>
<noscript><p>{{t:prayer_nojs}}</p></noscript>
</section>
