<section id="home" class="hero" aria-labelledby="home-heading">
<div class="wrap hero-grid">
<div class="hero-copy">
<div class="hero-identity">
<div class="hero-identity-label">
<span class="route-brand hero-identity-mark" aria-hidden="true"></span>
<p class="hero-identity-name"><strong>{{t:brand}}</strong><small>{{t:platform}}</small></p>
</div>
<h1 id="home-heading">{{t:slogan_first}} <em>{{t:slogan_second}}</em></h1>
<div class="hero-audience">
<div class="hero-audience-copy">
<strong>{{t:religious_affairs}}</strong>
<span>{{t:service_audience}}</span>
</div>
<img class="hero-audience-logo" src="{{root}}assets/ministry-of-defense-logo.jpg" alt="{{t:logo_alt}}" width="1200" height="720" decoding="async">
</div>
</div>
<p class="intro">{{t:hero_intro}}</p>
<div class="actions"><a class="button gold" href="#site-tour">{{t:tour_start}}</a></div>
</div>
<div class="hero-image" role="img" aria-label="{{t:hero_alt}}"></div>
</div>
</section>
