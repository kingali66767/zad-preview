<section id="home" class="hero" aria-labelledby="home-heading">
<div class="wrap hero-grid">
<div class="hero-copy">
<div class="hero-identity">
<div class="hero-identity-label">
<span class="route-brand hero-identity-mark" aria-hidden="true"></span>
<h1 id="home-heading" class="hero-identity-name"><strong>{{t:brand}}</strong> <small>{{t:platform}}</small></h1>
</div>
<figure class="hero-verse">
<blockquote lang="ar" dir="rtl">
<p><span aria-hidden="true">﴿</span>وَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ<span aria-hidden="true">﴾</span></p>
</blockquote>
<figcaption>{{t:home_verse_ref}}</figcaption>
</figure>
</div>
<p class="intro">{{t:hero_intro}}</p>
<div class="actions"><a class="button gold" href="#site-tour">{{t:tour_start}}</a></div>
</div>
<section class="daily-calendar" aria-labelledby="daily-calendar-heading" data-daily-calendar data-calendar-unavailable="{{t:calendar_unavailable}}">
<div class="daily-calendar-head">
<span class="section-icon" aria-hidden="true"><span class="zad-icon" data-icon="occasions"></span></span>
<div>
<h2 id="daily-calendar-heading">{{t:calendar_heading}}</h2>
<p class="daily-calendar-timezone">{{t:calendar_timezone}}</p>
</div>
</div>
<p class="daily-calendar-status" data-calendar-status role="status" hidden></p>
<div class="daily-calendar-dates" data-calendar-dates hidden>
<p class="daily-calendar-weekday" data-calendar-weekday></p>
<dl class="daily-calendar-formats">
<div class="daily-calendar-date">
<dt>{{t:calendar_hijri}}</dt>
<dd><time data-calendar-hijri></time><p data-calendar-hijri-fallback hidden>{{t:calendar_hijri_unavailable}}</p></dd>
</div>
<div class="daily-calendar-date">
<dt>{{t:calendar_gregorian}}</dt>
<dd><time data-calendar-gregorian></time></dd>
</div>
</dl>
</div>
<noscript><p class="daily-calendar-status">{{t:calendar_nojs}}</p></noscript>
</section>
</div>
</section>
